<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Slides</title>
<style>
html,body{height:100%;margin:0}
/* slides v2.7.0 — a lightweight, dependency-free presentation engine. MIT. */
/* ── Tokens: everything visual is a variable. Override them on .sv (or a parent) to restyle a deck. ── */
.sv{
  --paper:#fbfbf9; --ink:#1b1d20; --ink-2:#4a4e54; --mist:#7b8087;
  --rule:#e1e2df; --rule-2:#f0f0ed; --code-bg:#f4f4f1;
  --accent:#2e63a6; --accent-ink:#244f85; --accent-tint:rgba(46,99,166,.09);
  --mark:#f7e39a; --mark-ink:#2b2a1f;
  --math:#1d4f8f;                  /* formulas stand out from prose (set to var(--ink) for plain) */
  --blue:#dbe7f6;  --blue-ink:#2f5f9a;   --green:#dcefe1; --green-ink:#2f7a4d;
  --amber:#fbeac6; --amber-ink:#9a6b12;  --rose:#f9dfe3;  --rose-ink:#a8404f;
  --violet:#e8e1f5;--violet-ink:#6a4fa3; --gray:#ececea;  --gray-ink:#5c6066;
  --c1:var(--accent);--c2:var(--green-ink);--c3:var(--amber-ink);--c4:var(--rose-ink);--c5:var(--violet-ink);--c6:var(--gray-ink);
  --muted-opacity:.32;             /* how faded "past" bullets are in fade mode */
  --muted-block-opacity:.75;       /* diagrams / code / images fade less so they stay readable while bullets explain them */
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  --slide-max:1100px;              /* content column */
  --stage-pad:6cqh clamp(24px,8cqw,120px);
  color-scheme:light;
}
.sv[data-theme="dark"]{
  --paper:#15171b; --ink:#e6e4df; --ink-2:#b9b7b1; --mist:#8b8f96;
  --rule:#2c2f35; --rule-2:#1e2126; --code-bg:#1c1f24;
  --accent:#7aa6df; --accent-ink:#a3c2ec; --accent-tint:rgba(122,166,223,.14);
  --mark:#5a4d14; --mark-ink:#f4e7a8;
  --math:#9ec5f5;
  --blue:#223650;  --blue-ink:#9cc0ee;   --green:#1f3a2a; --green-ink:#8fd2a6;
  --amber:#3d3116; --amber-ink:#e6c36a;  --rose:#3f2229;  --rose-ink:#ee9daa;
  --violet:#2d2542;--violet-ink:#c3aef0; --gray:#2a2d32;  --gray-ink:#b5b8bd;
  color-scheme:dark;
}

/* ── Root, stage, slides. Sizes are container-relative so the same deck works full-screen or in a box. ── */
.sv,.sv *,.sv *::before,.sv *::after{box-sizing:border-box}
.sv{position:relative;overflow:hidden;font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;container-type:size;
  font-size:calc(.55cqw + .55cqh + 6px);margin:0;padding:0;outline:none}
.sv.sv-body{position:fixed;inset:0;height:100%}
.sv.sv-box{width:100%;aspect-ratio:16/9;border-radius:10px;border:1px solid var(--rule)}
.sv.sv-box:fullscreen{border:0;border-radius:0;aspect-ratio:auto}
.sv.idle{cursor:none}
.sv kbd{font:500 .8em var(--mono);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 .35em;color:var(--ink-2)}
.sv a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
.sv a:hover{border-bottom-color:currentColor}
.sv button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.sv :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sv .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:var(--stage-pad)}
.sv .slide{width:100%;max-width:var(--slide-max);max-height:100%;overflow:auto;padding:1em 0;animation:sv-in .32s var(--ease) both;--scale:1}
.sv .slide.out{animation:sv-out .18s ease-in both}
@keyframes sv-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sv-out{to{opacity:0;transform:translateY(-8px)}}
.sv .slide h1{font-size:calc(2.15em*var(--scale));font-weight:600;letter-spacing:-.012em;line-height:1.2;margin:0 0 clamp(20px,3.5cqh,38px)}
.sv .slide.center{text-align:center}
.sv .slide.center .items,.sv .slide.center .text{margin-inline:auto}
.sv .slide.title,.sv .slide.section{text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:60cqh}
.sv .slide.title h1{font-size:calc(3.8em*var(--scale));margin-bottom:.35em}
.sv .slide.title .sub{font-size:calc(1.5em*var(--scale));color:var(--mist);font-weight:400;margin:0}
.sv .slide.section h1{font-size:calc(2.9em*var(--scale))}
.sv .slide.section .sub{color:var(--mist);margin:.9em 0 0}
.sv .slide .sub{font-size:1.1em;color:var(--mist);margin:-.6em 0 1.2em}

/* ── Items (bullets & blocks): the reveal machine ── */
.sv .items{display:flex;flex-direction:column;gap:clamp(6px,1.2cqh,12px);max-width:960px}
.sv .item{position:relative;padding:.35em .9em .35em 1em;border-left:3px solid transparent;font-size:calc(1.38em*var(--scale));
  transition:opacity .35s var(--ease),transform .35s var(--ease),border-color .3s}
.sv .item.d1{margin-left:1.6em;font-size:calc(1.24em*var(--scale))}
.sv .item.d2{margin-left:3.2em;font-size:calc(1.17em*var(--scale))}
.sv .item.future{opacity:0;transform:translateY(6px);pointer-events:none}
.sv.marker .item.current{border-left-color:var(--accent)}        /* off by default: the un-faded bullet is the cue */
.sv .item.past.m-fade{opacity:var(--muted-opacity)}
.sv .item.block.past.m-fade{opacity:var(--muted-block-opacity)}
.sv .item.past.m-hide{opacity:0;visibility:hidden}
.sv .item.past.m-keep,.sv .item.shown{opacity:1}
.sv .text{line-height:1.55;max-width:34em}
.sv .text code,.sv .sub code,.sv .quiz code,.sv .cc code{font:.88em var(--mono);background:var(--code-bg);border:1px solid var(--rule);border-radius:4px;padding:.05em .35em}
.sv .text mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 .15em}
.sv .text strong{font-weight:600}
.sv .ok{color:var(--green-ink);font-weight:700}.sv .no{color:var(--rose-ink);font-weight:700}
.sv .tex{font-family:var(--mono);font-size:.9em;color:var(--math)}
.sv .katex{font-size:1.12em;color:var(--math)}
.sv .katex-display{margin:.45em 0;font-size:1.2em}
.sv .cap{font-size:.78em;color:var(--mist);margin-top:.5em;text-align:center}
.sv .err{background:var(--rose);color:var(--rose-ink);border-radius:8px;padding:.6em 1em;font-size:.85em}
.sv .raw{font-size:.9em}

/* ── Code, pseudocode, media, tables, demo links, quiz ── */
.sv .code{background:var(--code-bg);border:1px solid var(--rule);border-radius:8px;overflow:auto;max-height:62cqh;font-size:.82em}
.sv .code .lbl{font:500 .8em var(--mono);color:var(--mist);padding:.6em 1.2em 0}
.sv .code pre{margin:0;padding:.85em 1.2em;font:1em/1.6 var(--mono);tab-size:4}
.sv .tk-c{color:var(--mist);font-style:italic}.sv .tk-s{color:var(--green-ink)}.sv .tk-n{color:var(--amber-ink)}
.sv .tk-k{color:var(--accent-ink);font-weight:600}.sv .tk-b{color:var(--violet-ink)}.sv .tk-p{color:var(--rose-ink)}.sv .tk-f{color:var(--ink)}
.sv .algo{background:var(--code-bg);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:6px;
  padding:.85em 1.2em;font:.85em/1.75 var(--mono);white-space:pre;overflow:auto;max-height:62cqh}
.sv .algo .kw{color:var(--accent-ink);font-weight:600}.sv .algo .cm{color:var(--mist);font-style:italic}
.sv .fig{text-align:center;margin:0 auto}
.sv .fig img,.sv .fig video{max-width:100%;max-height:62cqh;height:auto;border-radius:8px;border:1px solid var(--rule);display:inline-block}
.sv .fig iframe{width:min(100%,860px);aspect-ratio:16/9;border:0;border-radius:8px;display:block;margin:0 auto}
.sv .fig audio{width:min(100%,600px);display:block;margin:0 auto}
.sv table.tbl{width:100%;border-collapse:collapse;font-size:.85em}
.sv .tbl th,.sv .tbl td{padding:.5em .9em;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
.sv .tbl th{font-weight:600;border-bottom:2px solid var(--ink-2)}
.sv .tbl tr:last-child td{border-bottom:0}
.sv .tblw{overflow-x:auto}
.sv a.demo{display:inline-flex;align-items:center;gap:.45em;border:1.5px solid var(--accent);border-radius:999px;padding:.3em 1em;font-size:.85em;font-weight:500;color:var(--accent-ink)}
.sv a.demo:hover{background:var(--accent-tint)}

/* ── Html fragments and frames: data-step elements wait at opacity 0; a frame alone on a slide takes the room, and without a title the whole stage ── */
.sv .raw [data-step]{opacity:0;transition:opacity .35s var(--ease)}.sv .raw [data-step].on{opacity:1}
.sv .fig.emb{display:flex;flex-direction:column;height:62cqh}
.sv .item:only-child>.fig.emb{height:70cqh}
.sv .items:first-child>.item:only-child>.fig.emb{height:78cqh}
.sv .slide:has(>.items:first-child>.item:only-child>.emb),.sv .slide:has(>.items:first-child>.item:only-child>.emb) .items{max-width:none}
.sv .fig.emb iframe{flex:1;min-height:0;width:100%;aspect-ratio:auto;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
.sv .fig.emb iframe.hf{border:0;background:none}

/* ── Native diagrams ── */
.sv .dgw{display:flex;flex-direction:column;align-items:center}
.sv .dg{display:block;width:100%;height:auto;max-height:64cqh;overflow:visible;font-family:var(--sans)}
.sv .dg text{fill:var(--ink);font-size:16px;font-weight:500;dominant-baseline:central;text-anchor:middle;user-select:none}
.sv .dg .grp rect{fill:var(--rule-2);stroke:var(--rule);stroke-width:1;stroke-dasharray:4 4;rx:12}
.sv .dg .grp text{fill:var(--mist);font-size:13px;font-weight:600;text-anchor:start;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.sv .dg .grp{opacity:0;transition:opacity .4s}.sv .dg .grp.on{opacity:1}
.sv .dg .nd{opacity:0;transform:scale(.92);transform-box:fill-box;transform-origin:center;transition:opacity .35s var(--ease),transform .35s var(--ease)}
.sv .dg .nd.on{opacity:1;transform:none}
.sv .dg .nd .shp{fill:var(--paper);stroke:var(--ink-2);stroke-width:1.5;transition:fill .3s,stroke .3s}
.sv .dg .nd.blue .shp{fill:var(--blue);stroke:var(--blue-ink)}   .sv .dg .nd.green .shp{fill:var(--green);stroke:var(--green-ink)}
.sv .dg .nd.amber .shp{fill:var(--amber);stroke:var(--amber-ink)}.sv .dg .nd.rose .shp{fill:var(--rose);stroke:var(--rose-ink)}
.sv .dg .nd.violet .shp{fill:var(--violet);stroke:var(--violet-ink)}.sv .dg .nd.gray .shp{fill:var(--gray);stroke:var(--gray-ink)}
.sv .dg .nd.em .shp,.sv .dg .nd.new .shp{stroke:var(--accent);stroke-width:2;fill:var(--accent-tint)}
.sv .dg .ed path{fill:none;stroke:var(--ink-2);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
  transition:stroke-dashoffset .55s var(--ease),stroke .3s}
.sv .dg .ed.on path{stroke-dashoffset:0}
.sv .dg .ed.dash path{stroke-dasharray:6 5;stroke-dashoffset:0;opacity:0;transition:opacity .4s}
.sv .dg .ed.dash.on path{opacity:1}
.sv .dg .ed.thick path{stroke-width:3}
.sv .dg .ed .ah{fill:var(--ink-2);opacity:0;transition:opacity .2s ease .4s,fill .3s}
.sv .dg .ed.on .ah{opacity:1}
.sv .dg .ed.new path{stroke:var(--accent)}.sv .dg .ed.new .ah{fill:var(--accent)}
.sv .dg .ed text{font-size:13px;fill:var(--mist);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round;opacity:0;transition:opacity .3s ease .35s}
.sv .dg .ed.on text{opacity:1}
.sv .dg .nd.dim,.sv .dg .ed.dim{opacity:.22}
.sv .dcap{font-size:.85em;color:var(--ink-2);margin-top:.6em;min-height:1.4em;text-align:center;transition:opacity .3s}

/* ── Native charts ── */
.sv .ch{display:block;width:100%;height:auto;max-height:60cqh;font-family:var(--sans)}
.sv .ch text{fill:var(--mist);font-size:12px}
.sv .ch .ttl{fill:var(--ink);font-size:15px;font-weight:600}
.sv .ch .grid{stroke:var(--rule);stroke-width:1}
.sv .ch .axis{stroke:var(--ink-2);stroke-width:1}
.sv .ch .sr .bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform .5s var(--ease)}
.sv .ch .sr.on .bar{transform:none}
.sv .ch .sr .ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset .7s var(--ease)}
.sv .ch .sr.on .ln{stroke-dashoffset:0}
.sv .ch .sr .pt{opacity:0;transition:opacity .3s ease .5s}.sv .ch .sr.on .pt{opacity:1}
.sv .ch .sr .lg{opacity:.25;transition:opacity .3s}.sv .ch .sr.on .lg{opacity:1}
/* Quiz: a question and its options; .chosen marks the learner's pick, .revealed shows the answer */
.sv .quiz .qq{font-weight:600;margin-bottom:.45em}
.sv .quiz .qo{margin:0;padding-left:1.7em;display:flex;flex-direction:column;gap:.3em}
.sv .quiz .qo li::marker{color:var(--mist);font-variant-numeric:tabular-nums}
.sv .quiz .qo button{text-align:left;padding:.12em .55em;border-radius:6px;border:1.5px solid transparent;line-height:1.45}
.sv .quiz .qo button:hover{background:var(--accent-tint)}
.sv .quiz li.chosen button{border-color:var(--accent)}
.sv .quiz.revealed li[data-ok] button{background:var(--green);color:var(--green-ink);border-color:var(--green-ink)}
.sv .quiz.revealed li.chosen:not([data-ok]) button{background:var(--rose);color:var(--rose-ink);border-color:var(--rose-ink)}

/* ── Chrome: hidden unless asked for. Progress + counter (C), toast, overlays, notes drawer ── */
.sv .prog{position:absolute;top:0;left:0;height:2px;width:0;background:var(--accent);opacity:.75;transition:width .35s var(--ease);z-index:50;display:none}
.sv .count{position:absolute;right:1.6em;bottom:1.2em;font-size:.8em;color:var(--mist);opacity:.7;user-select:none;z-index:50;font-variant-numeric:tabular-nums;display:none}
.sv.chrome .prog,.sv.chrome .count{display:block}
.sv .toast{position:absolute;left:50%;bottom:3.8em;transform:translate(-50%,8px);background:var(--ink);color:var(--paper);padding:.45em 1em;border-radius:999px;
  font-size:.85em;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:200;white-space:nowrap}
.sv .toast.on{opacity:1;transform:translate(-50%,0)}
.sv .ovl{position:absolute;inset:0;z-index:300;display:none;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(6px);font-size:16px}
.sv .ovl.on{display:flex}
.sv .ovl.blank{z-index:400;background:#000}
.sv .card{margin:auto;background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:28px 32px;max-width:min(92%,720px);max-height:92%;overflow:auto;box-shadow:0 24px 60px -20px rgba(0,0,0,.35)}
.sv .card h2{font-size:1.15em;font-weight:600;margin:0 0 14px}
.sv .card p{color:var(--mist);font-size:.92em;margin:0 0 12px}
.sv .btn{display:inline-block;background:var(--ink);color:var(--paper);border-radius:8px;padding:.55em 1.2em;font-weight:500;font-size:.95em;margin:4px 6px 4px 0}
.sv .btn.ghost{background:none;color:var(--ink);border:1px solid var(--rule)}
.sv .ovl.picker .card{text-align:center}
.sv .ovl.picker.drag .card{border-color:var(--accent);background:var(--accent-tint)}
.sv .keys{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 14px;font-size:.88em;align-items:center}
.sv .keys span:nth-child(odd){text-align:right}
.sv .keys span:nth-child(even){color:var(--ink-2)}
.sv .ovl.goto input{width:100%;font:inherit;font-size:1.3em;text-align:center;padding:.4em;border:1.5px solid var(--rule);border-radius:8px;background:var(--code-bg);color:var(--ink);margin-bottom:12px}
.sv .ovl.ov .card{max-width:min(94%,1100px);width:100%;max-height:86%;overflow:auto}
.sv .ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.sv .ovc{display:block;text-align:left;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;font-size:.85em;line-height:1.3;color:var(--ink)}
.sv .ovc small{display:block;color:var(--mist);margin-bottom:3px;font-variant-numeric:tabular-nums}
.sv .ovc:hover{border-color:var(--accent)}.sv .ovc.cur{border-color:var(--accent);background:var(--accent-tint)}
.sv .notes{position:absolute;left:0;right:0;bottom:0;z-index:150;background:var(--paper);border-top:1px solid var(--rule);padding:14px 32px 18px;
  transform:translateY(100%);transition:transform .3s var(--ease);max-height:38%;overflow:auto;font-size:.95em}
.sv .notes.on{transform:none}
.sv .notes .meta{display:flex;gap:24px;color:var(--mist);font-size:.8em;margin-bottom:8px;font-variant-numeric:tabular-nums}
.sv .notes .body{color:var(--ink-2);max-width:70ch;white-space:pre-wrap}

/* ── Presenter tools: laser, spotlight, pen, marker, draggable toolbar (T) ── */
.sv .ink{position:absolute;inset:0;z-index:120;pointer-events:none;mix-blend-mode:multiply;touch-action:none}
.sv[data-theme="dark"] .ink{mix-blend-mode:normal}
.sv .ink.live{pointer-events:auto;cursor:crosshair}
.sv .spot{position:absolute;inset:0;z-index:110;pointer-events:none;display:none;
  background:radial-gradient(circle at var(--x,50%) var(--y,50%),transparent var(--r,140px),rgba(0,0,0,.6) calc(var(--r,140px) + 48px))}
.sv .spot.on{display:block}
.sv .laser{position:absolute;left:0;top:0;width:var(--d,14px);height:var(--d,14px);border-radius:50%;background:var(--lc,#e5484d);
  box-shadow:0 0 0 3px rgba(255,255,255,.55),0 0 18px 4px var(--lc,#e5484d);z-index:130;pointer-events:none;display:none;transform:translate(-50%,-50%)}
.sv .laser.on{display:block}
.sv.tool-laser{cursor:none}
.sv .tbar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:160;display:flex;align-items:center;gap:2px;
  background:var(--ink);color:var(--paper);padding:6px 10px;border-radius:999px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .25s;font-size:13px;user-select:none;white-space:nowrap}
.sv .tbar.on{opacity:1;pointer-events:auto}
.sv .tbar button{padding:.35em .7em;border-radius:999px;color:inherit;opacity:.85}
.sv .tbar button:hover{background:rgba(255,255,255,.12);opacity:1}
.sv .tbar button.act{background:var(--paper);color:var(--ink);opacity:1}
.sv .tbar .sep{width:1px;height:18px;background:rgba(255,255,255,.18);margin:0 6px}
.sv .tbar .grip{cursor:grab;opacity:.5;padding:0 6px;letter-spacing:-2px}
.sv .tbar .sw{width:16px;height:16px;border-radius:50%;padding:0;margin:0 2px;border:2px solid transparent}
.sv .tbar .sw.act{border-color:var(--paper)}
.sv .tbar input[type=range]{width:70px;accent-color:var(--paper);margin:0 6px}
.sv .tbar kbd{border-color:rgba(255,255,255,.25);color:inherit;opacity:.6;margin-left:.3em;font-size:.7em}

/* ── Narration bar (A), captions (V), "Listen" prompt, live source editor (E), presenter view (W) ── */
.sv .nar{position:absolute;left:1.4em;bottom:1.1em;z-index:150;display:flex;align-items:center;gap:.6em;font-size:.78em;color:var(--mist);
  background:color-mix(in srgb,var(--paper) 80%,transparent);backdrop-filter:blur(6px);border:1px solid var(--rule);border-radius:999px;padding:.3em .9em .3em .5em;
  opacity:0;pointer-events:none;transition:opacity .3s;font-variant-numeric:tabular-nums;user-select:none}
.sv .nar.on{opacity:1;pointer-events:auto}
.sv.idle .nar.on{opacity:.35}
.sv .nar button{padding:.1em .45em;border-radius:999px;color:var(--ink);font-size:1em;line-height:1.4}
.sv .nar button:hover{background:var(--accent-tint)}
.sv .nar .nPlay{min-width:2em;text-align:center}
.sv .nar .nRate{color:var(--mist);font-size:.9em}
.sv .nar .nTrack{width:min(28cqw,260px);height:3px;background:var(--rule);border-radius:2px;cursor:pointer;position:relative}
.sv .nar .nFill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:2px}

# Backtracking
## Choose, explore, unchoose

---
# Where we are

- L15: depth-first search goes deep, then returns to try the next branch.
- L20: dynamic programming reuses answers to a small set of subproblems.
- Some problems have no small set: we must search many arrangements.
- Today: search depth first over **partial solutions**, and abandon dead ends early.

> Depth-first search from the graphs lectures is the engine of today's method, but the graph is no longer given to us: it is the tree of all ways to make choices one at a time. Last lecture every problem had a modest number of distinct subproblems. Today the answers themselves can be exponentially many, so the goal is to search without wasting work on choices that can never succeed.

---
# By the end of today you can

- Draw the state-space tree for a small search problem.
- Write a backtracking method with choose, explore, unchoose.
- Generate all subsets and permutations, and count them.
- Prune N-Queens and subset sum, and measure what pruning saves.
- Explain why pruning does not remove the exponential worst case.
- Place backtracking next to brute force, DP and branch and bound.

> By the end you should be able to take a puzzle you have never seen, say what one choice is, say when a partial solution is already hopeless, and write the recursive search. Measuring matters too: we will count search-tree nodes by running the code, so you can see pruning work rather than take it on faith.

---
# Four queens on a four-by-four board

- Place 4 queens so that no two share a row, a column or a diagonal.
- Any 4 of the 16 squares: $\binom{16}{4} = 1820$ placements to test.
- One queen per row: $4^4 = 256$ complete placements.
- Backtracking, measured: **17** search nodes, and both solutions found.
- The trick: reject a queen the moment it is attacked.

> A queen attacks along its row, its column and both diagonals. Testing every set of four squares works but is wasteful. Putting one queen in each row already shrinks the space, because two queens in one row can never be right. Backtracking goes further: as soon as a newly placed queen is attacked, it abandons every completion of that partial board at once. The number seventeen was counted by running today's Java code.

---

| Problem | Input traced on the slides |

| All subsets | `[a, b, c]` |
| All permutations | `[1, 2, 3]` |
| N-Queens | the 4-by-4 board; counts for $n = 4$ to $8$ |
| Subset sum | sorted `[2, 3, 5, 6, 8]`, target `10` |
| Combination sum | coins `[1, 3, 4]`, target `6` (as in L20) |

Every trace and count on later slides was produced by the tested Java code.

> Four-Queens is the main example, and we will follow its search from the first queen to the last dead end. The subset-sum input is small enough to draw its whole pruned tree. The combination-sum input is the coin example from the dynamic programming lecture, so you can compare listing the answers with counting them.

---
@type section
# The idea

---
# Build, check, undo

- A **partial solution** fixes some choices and leaves the rest open.
- Extend it by **one choice**, then recurse on what remains.
- If the partial solution cannot be completed, **backtrack**: undo the last choice.
- **Pruning**: skipping a subtree because its partial solution cannot be completed.
- Then try the next option for that choice.
- Record a complete, valid solution when you reach one.

> Think of a maze walked with one hand on the wall of options. At each junction you pick the first unexplored way. At a dead end you walk back to the most recent junction with an untried way. The word backtrack refers to that walking back. The key efficiency idea is the dead-end test: the earlier you can tell a partial solution is hopeless, the more work you skip.

---
# The state-space tree

```diagram
@dir TB
R[chosen: none] -> A[a] : include a
R -> N[none] : skip a
A -> AB[a, b] : include b
A -> A2[a] : skip b
N -> B[b] : include b
N -> N2[none] : skip b
```

- Node: a partial solution. Edge: one choice. Depth: choices made so far.
- The search visits this tree **depth first**; it is never stored.

> This is the tree for subsets of two items, a and b. The root has made no choices. Each level decides one item, include or skip, so the leaves are the four subsets. Backtracking walks the tree in depth-first order and keeps only the current path in memory, which is why its extra space is proportional to the depth, not to the size of the tree.

---
# The template in pseudocode

```algorithm
function BACKTRACK(partial):
  if partial is a complete solution then
    record a copy of partial
    return
  for each option for the next choice do
    if option is consistent with partial then   // pruning test
      apply option to partial                   // choose
      BACKTRACK(partial)                        // explore
      undo option                               // unchoose
```

> Every method today has this shape. The base case records a solution. The loop tries each option for the next decision. The consistency test is where pruning happens: skip options that already break a rule. Choose changes the shared partial solution, explore recurses, and unchoose restores it exactly, so the next option starts from the same state.

---
# The template in Java: all subsets

```java
private static <T> void subsets(List<T> items, int i, List<T> chosen,
        List<List<T>> out) {
    if (i == items.size()) {             // all decided: record a copy
        out.add(new ArrayList<>(chosen));
        return;
    }
    chosen.add(items.get(i));            // choose: include items[i]
    subsets(items, i + 1, chosen, out);  // explore
    chosen.remove(chosen.size() - 1);    // unchoose
    subsets(items, i + 1, chosen, out);  // explore without items[i]
}
```

- One list `chosen` is shared by every call; unchoose restores it.

> Here the next choice is item i, and there are two options, include it or skip it. Look at the three commented lines in the middle: add, recurse, remove. Removing the last element undoes exactly the add. The base case stores a copy, because chosen keeps changing after we return. No pruning is needed here, since every subset is an answer.

---
@type section
# Subsets and permutations

---
# Subsets of `[a, b, c]`, in the order produced

| Step | `chosen` when recorded | Last choices |
|---|---|---|
| 1 | `[a, b, c]` | include a, b, c |
| 2 | `[a, b]` | unchoose c, skip c |
| 3 | `[a, c]` | unchoose b, skip b, include c |
| 4 | `[a]` | unchoose c, skip c |
| 5 | `[b, c]` | back to the root; skip a |
| 6, 7, 8 | `[b]`, `[c]`, `[]` | the same pattern without a |

- Each item has 2 options, so there are $2^n$ subsets: here $2^3 = 8$.

> The order comes from trying include before skip. The first leaf includes everything. Each later leaf appears after undoing the most recent include and switching it to skip. The output list was printed by the Java code, and the check program confirms two to the n distinct subsets for every n up to seven, including one subset, the empty one, for an empty input.

---
# Permutations: choose an unused item

```java
for (int k = 0; k < items.size(); k++) {
    if (used[k]) continue;                  // each item appears once
    used[k] = true;                         // choose
    order.add(items.get(k));
    permute(items, used, order, out);       // explore
    order.remove(order.size() - 1);         // unchoose
    used[k] = false;
}
```

- The next choice is the next position; the options are the unused items.
- Unchoose must undo **both** changes: the list and the `used` flag.

> This loop sits after a base case that records a copy when order holds every item. The boolean array used is part of the state. Choosing an item sets its flag and appends it; unchoosing removes it and clears the flag. Forgetting to clear the flag is a common bug: the item would stay blocked for all later branches, and most permutations would never appear.

---
# The permutation tree for `[1, 2, 3]`

```diagram
@dir LR
@reveal manual
R[order: none]
focus R
--- Nothing placed yet. Three options for position 0.
R -> P1[1] -> P12[1, 2] -> P123[1, 2, 3]
focus R P1 P12 P123
--- First leaf: [1, 2, 3], recorded.
P1 -> P13[1, 3] -> P132[1, 3, 2]
focus P1 P13 P132
--- Undo 3, undo 2, place 3, then 2: [1, 3, 2].
R -> P2[2]
R -> P3[3]
focus R P2 P3
--- Undo back to the root. Branches 2 and 3 give the other four.
```

- Output order from the code: `123, 132, 213, 231, 312, 321`. That is $3! = 6$.

> Position zero has three options, position one has the two items left, and position two has one. That product, three times two times one, is three factorial. The tree drawn here shows only the first branch in full; the branches starting with two and with three have the same shape. The six orderings listed at the bottom were printed by the Java code in this order.

---
# How much work is listing everything?

| Generator | Outputs | Time, including copies |
|---|---|---|
| Subsets of $n$ items | $2^n$ | $\Theta(n\,2^n)$ |
| Permutations of $n$ items | $n!$ | $\Theta(n\cdot n!)$ |

- Each output is a list of up to $n$ items, and copying it costs $\Theta(n)$.
- No method that lists them all can be faster than the total output size.
- Extra space besides the output: $\Theta(n)$ for the path and the stack.

> For subsets the tree has two to the n plus one, minus one nodes, each doing constant work, plus a copy of length up to n at each leaf. For permutations the internal nodes number at most a small constant times n factorial, and each loops over n items. When the task is to list every arrangement, exponential time is unavoidable because the answer itself is exponentially long.

---
# Quick check

```quiz
How many lists does `permutations` return for four distinct items?
- [ ] 16
- [x] 24
- [ ] 64
- [ ] 256
```

> Twenty-four, which is four factorial: four choices for the first position, three for the second, two for the third and one for the last. Sixteen is two to the fourth, the number of subsets. Two hundred fifty-six is four to the fourth, which would allow an item to repeat. The check program confirms n factorial distinct lists for every n up to seven.

@type section
# N-Queens: method

---
# One queen per row

- `col[r]` is the column of the queen in row `r`. Rows are filled 0, 1, 2, ...
- One queen per row is built in; we only check columns and diagonals.
- Squares on one **diagonal** share $r - c$; on one **anti-diagonal** they share $r + c$.
- Keep three boolean arrays: `colUsed[n]`, `diagUsed[2n-1]`, `antiUsed[2n-1]`.
- Then "is this square attacked?" takes constant time.

> Choosing the representation is half the design. Because each row gets exactly one queen, the row rule can never be broken. Moving down-right along a diagonal adds one to both r and c, so r minus c stays the same; moving down-left keeps r plus c the same. The value r minus c ranges from minus n plus one to n minus one, so we shift it by n minus one to get an array index.

---
# Checking and marking in Java

```java
private boolean safe(int r, int c) {
    return !colUsed[c] && !diagUsed[r - c + n - 1] && !antiUsed[r + c];
}

private void mark(int r, int c, boolean value) {
    colUsed[c] = value;
    diagUsed[r - c + n - 1] = value;
    antiUsed[r + c] = value;
}
```

- `mark(r, c, true)` is part of choose; `mark(r, c, false)` is unchoose.

> The safety test reads three flags. Marking and unmarking write the same three flags, so unchoose is exact. Could two queens ever share a diagonal flag incorrectly? No: each flag belongs to exactly one line of the board, and at most one queen stands on any line in a consistent partial solution, so clearing a flag on unchoose never frees a line that another queen still uses.

---
# PLACE in pseudocode

```algorithm
function PLACE(r):                   // rows 0..r-1 hold safe queens
  if r = n then
    record a copy of col; return
  for c ← 0 to n - 1 do
    if square (r, c) is attacked then continue   // prune
    col[r] ← c; mark (r, c)          // choose
    PLACE(r + 1)                     // explore
    unmark (r, c)                    // unchoose
```

- Invariant: on entry, the queens in rows `0..r-1` attack no one.

> The comment on the first line is the invariant that makes the method correct. It holds for row zero because no queens are placed. If it holds on entry, the only queens added are on unattacked squares, so it holds for the recursive call. So when r reaches n, all n queens are mutually safe. And no solution is missed, because we only skip squares that are already attacked.

---
# PLACE in Java

```java
private void place(int r) {
    nodes++;
    if (r == n) {                               // all rows filled: a solution
        solutions.add(col.clone());
        return;
    }
    for (int c = 0; c < n; c++) {
        if (!allowed(r, c)) continue;           // prune: attacked square
        col[r] = c;                             // choose
        mark(r, c, true);
        place(r + 1);                           // explore
        mark(r, c, false);                      // unchoose
    }
}
```

> The method allowed is the safety test from the previous slide; in the tested file it also writes a step log, used for the traces on the next slides, and the logging lines are left out here. The counter nodes counts every call, including the root, and it is how we will measure pruning. Note col dot clone in the base case: the array keeps changing as the search continues, so we store a copy.

---
@type section
# N-Queens: trace and cost

---
# 4-Queens: the first queen in column 0

```diagram
@dir LR
@reveal manual
R[empty board]
focus R
--- Start: row 0 tries column 0 first.
R -> A[0] -> A2[0, 2]
focus R A A2
--- Row 1: columns 0 and 1 are attacked; place at 2.
A2 -> D1[dead end].rose : row 2: all 4 attacked
focus A2 D1
--- Every square in row 2 is attacked. Undo row 1.
A -> A3[0, 3] -> A31[0, 3, 1]
focus A A3 A31
--- Row 1 at column 3; row 2 at column 1 (column 0 is attacked).
A31 -> D2[dead end].rose : row 3: all 4 attacked
focus A31 D2
--- Row 3 is dead, row 2 columns 2 and 3 are attacked, row 1 has no more columns.
```

> Labels list the queens' columns by row, so zero, three, one means rows zero, one and two hold queens in columns zero, three and one. Follow the step log printed by the code. With a queen in the corner, row one rejects columns zero and one and places at column two. Row two then finds all four squares attacked, so the search backs up and moves the row one queen to column three. Row two rejects column zero and places at column one, and row three is completely attacked. Nothing else fits, so the corner queen itself is removed.

# Pruning does not remove the exponential worst case

- Pruning can shrink the tree, but for subset sum some inputs prune nothing, so the worst case stays $\Theta(2^n)$ nodes.
- Example: target $\ge$ the total of all numbers. The size test never fires.
- Pruned N-Queens nodes still grow by a factor of about 2.8 to 3.7 per extra row here.
- Listing all subsets or permutations needs exponential time for the output alone.

> A pruning rule is only as good as the inputs let it be. For subset sum, if the target is at least the sum of every number, no partial sum ever exceeds it, so the break never happens and the search visits every subset. For the searches in this lecture, the safe worst-case bound is the size of the unpruned tree. Measured counts on particular inputs, like the N-Queens table, can be far smaller, and good pruning is often what makes a search practical.

# Subset sum on sorted input

- Given positive integers, find every subset with sum exactly `target`.
- Input `[2, 3, 5, 6, 8]`, target `10`. Answers: `[2, 3, 5]` and `[2, 8]`.
- Choice at each step: the next number to add, taken left to right.
- Pruning: if `a[i] > remaining`, stop the loop.
- Sorted input makes that a `break`: every later number is at least as large.

> Each call tries every later number as the next one to add, so each subset is built in increasing order exactly once. The pruning test is simple: if the next number alone exceeds what remains, it cannot be used. On sorted input a stronger conclusion follows for free, because every number after it is at least as big, so the whole rest of the loop can be skipped.

---
# Subset sum in Java

```java
private static void search(int[] a, int start, int remaining, List<Integer> chosen,
                           List<List<Integer>> out, boolean prune, boolean reuse) {
    nodes++;
    if (remaining == 0) {
        out.add(new ArrayList<>(chosen));
        return;
    }
    for (int i = start; i < a.length; i++) {
        if (prune && a[i] > remaining) break;   // sorted: later a[i] are too big
        chosen.add(a[i]);                       // choose
        search(a, reuse ? i : i + 1, remaining - a[i], chosen, out, prune, reuse);
        chosen.remove(chosen.size() - 1);       // unchoose
    }
}
```

> The two flags let one method serve three searches: with and without pruning, and with reuse for combination sum. Without reuse, the recursive call starts at i plus one, so each number is used at most once. The base case fires when nothing remains; because all numbers are positive, no extension of a solution can also be a solution.

# Combination sum: reuse allowed

- Change one argument: recurse on `i` instead of `i + 1`.
- Coins `[1, 3, 4]`, target `6` gives 4 multisets, printed by the code:
- `[1,1,1,1,1,1]`, `[1,1,1,3]`, `[1,1,4]`, `[3,3]`. The search visited 15 nodes.
- L20 counted the same 4 with `countWays` in $\Theta(kA)$ time.
- Listing all answers costs at least their total size; counting does not.

> Passing i rather than i plus one lets the same number be chosen again, while never going back to a smaller one, so each multiset appears once, in nondecreasing order. That is exactly the question the coin-counting loop answered in the last lecture. The difference is what we ask for: DP counts the four ways without building them, while backtracking produces each one, which is necessary when you need the actual lists.

- **Sudoku**: choice = a digit for the next empty cell; prune on row, column and box.
- **Graph coloring**: choice = a color for the next vertex; prune if a neighbor has it.
- **Word search, mazes**: choice = the next step; prune on walls and visited cells.
- The pattern: what is one choice, and when is a partial solution hopeless?

# Backtracking among its neighbours

| Method | Explores | Uses |
|---|---|---|
| Brute force | Every complete candidate | Tiny inputs, test oracles |
| Backtracking | Partial candidates, prunes dead ends | Constraint problems, listing all answers |
| Dynamic programming | Each distinct subproblem once | Subproblems overlap |
| Branch and bound | Partial candidates, prunes by a bound | Optimisation |

> Brute force builds complete candidates and checks them at the end, which is what our unpruned N-Queens did. Backtracking checks as it builds. If the same subproblem appears on many branches, memoizing it turns the search into dynamic programming. Branch and bound, on the next slide, adapts pruning to optimisation, where many candidates are valid and we want the best.

---
# When subproblems overlap, memoize

- Decide the numbers in order, take or skip, and ask: can `a[i..]` reach `remaining`?
- That answer depends only on the pair (`i`, `remaining`), not on the path.
- Store it: $(n+1)(T+1)$ distinct pairs for target $T$, each solved once.
- Deciding or counting takes $\Theta(nT)$ time: pseudo-polynomial, so still exponential in the number of bits of $T$.
- Listing every answer can still take exponential time: there may be exponentially many.

> Different paths can reach the same index with the same amount remaining. Taking two and three and skipping five, or skipping two and three and taking five, both arrive at index three needing five. The rest of the search from that point is identical, so its answer can be stored. With a memo keyed by the pair, each pair is solved once, which is the same pseudo-polynomial behaviour as the knapsack table, and for the same reason: the table grows with the value of T, not with the few bits needed to write it.

---
# Branch and bound, briefly

- For **optimisation**: maximise or minimise over the valid solutions.
- Keep the best complete solution found so far.
- At each node compute an optimistic **bound** on any completion.
- If the bound cannot beat the best so far, prune the subtree.
- 0/1 knapsack: the fractional-knapsack value from L19 is such a bound.

> Suppose we search 0/1 knapsack by deciding item by item. At a partial choice, the best fractional completion is an upper bound on any whole-item completion, because allowing fractions can only help. If that bound is no better than a packing we already have, the subtree cannot contain a better answer and is skipped. How much this saves depends on the input; the worst case is still exponential.

---
# Common mistakes

- Forgetting to unchoose, or undoing only part of the state.
- Recording `chosen` itself instead of a copy: every stored answer ends up the same list.
- Using `break` for pruning on unsorted input; there only `continue` is safe.
- Duplicate values in the input give duplicate answers unless you skip equal neighbours.
- Pruning too eagerly: a test that rejects a completable partial solution loses answers.

> Most backtracking bugs come from shared mutable state. If unchoose is missing, later branches start from a wrong state. If you store the list itself, all stored references point to the one list that is empty when the search ends. The break in subset sum is valid only because the input is sorted. And a pruning test must be sound: it may only reject partial solutions that truly cannot be completed.

> Eight references to the same list. Every recorded entry is the one shared list chosen, not a snapshot of it. Each unchoose removes what the matching choose added, so when the search finishes, the shared list is empty, and printing the result shows eight empty lists. The copy in the base case is what freezes each answer.

# In Java

- `ArrayList` works well as the path: `add` at the end is amortized constant time.
- `remove(size() - 1)` removes the last element without shifting others.
- A `boolean[]` or `BitSet` records which items or lines are used.
- Recursion depth equals the number of choices, so the default stack is ample for these inputs.
- An explicit stack such as `ArrayDeque` turns the search iterative if needed.

> The standard library has no backtracking framework; the method is a pattern, not a class. The Java API documents that ArrayList add runs in amortized constant time. Removing the last element shifts nothing, since there is nothing after it. Recursion depth is the number of rows or items, at most a few dozen here, far below what overflows the call stack.

# Summary

- Backtracking: extend a partial solution one choice at a time, depth first.
- Choose, explore, unchoose; record copies at complete solutions.
- Subsets $2^n$, permutations $n!$: listing costs at least the output size.
- Pruning, measured: 8-Queens in 2,057 nodes, versus 109,601 (distinct columns) or 19,173,961.
- The worst case stays exponential; overlap means memoize, bounds mean branch and bound.

> The template is short, and nearly every bug lives in the state it shares between calls. The measured N-Queens numbers count search-tree nodes, not the safety checks each node performs, and they show why pruning matters in practice even against the one-queen-per-column baseline, while the subset-sum example with a large target shows why it does not change the worst case. When you meet a new search problem, name the choice, name the dead-end test, and check whether subproblems repeat.

// Chart engine —  type: bar|line   x: a, b, c   title: …   ymin/ymax   ylabel   reveal: series|all
//                 Series name: 1, 2, 3   (one series per reveal step)
function parseChart(src) {
  const c = { type: 'bar', x: [], series: [], title: '', ymin: null, ymax: null, reveal: 'series', ylabel: '' };
  src.split('\n').forEach(ln => {
    const m = ln.match(/^\s*([^:=]+?)\s*[:=]\s*(.+?)\s*$/); if (!m) return;
    const k = m[1].trim().toLowerCase(), v = m[2];
    if (k === 'type' || k === 'kind') c.type = v.trim().toLowerCase();
    else if (k === 'x' || k === 'labels' || k === 'categories') c.x = v.split(',').map(s => s.trim());
    else if (k === 'title') c.title = v.trim(); else if (k === 'ylabel' || k === 'y') c.ylabel = v.trim();
    else if (k === 'ymax' || k === 'max') c.ymax = +v; else if (k === 'ymin' || k === 'min') c.ymin = +v;
    else if (k === 'reveal') c.reveal = v.trim().toLowerCase();
    else c.series.push({ name: m[1].trim(), values: v.split(',').map(s => parseFloat(s)) });
  });

}

  if (hi === lo) hi = lo + 1;
  const span = hi - lo, mag = Math.pow(10, Math.floor(Math.log10(span))), stepC = [1, 2, 2.5, 5, 10].map(k => k * mag).find(k => span / k <= 5) || mag;
  hi = c.ymax ?? Math.ceil(hi / stepC) * stepC; lo = c.ymin ?? Math.floor(lo / stepC) * stepC;
  const X = i => ml + (i + .5) * pw / Math.max(1, c.x.length || c.series[0].values.length), Y = v => mt + ph - (v - lo) / (hi - lo) * ph;

  if (c.title) s += `<text class="ttl" x="${ml}" y="20">${esc(c.title)}</text>`;
  for (let v = lo; v <= hi + 1e-9; v += stepC) s += `<line class="grid" x1="${ml}" x2="${W - mr}" y1="${f(Y(v))}" y2="${f(Y(v))}"/><text x="${ml - 8}" y="${f(Y(v))}" text-anchor="end" dominant-baseline="central">${+v.toFixed(6)}</text>`;
  s += `<line class="axis" x1="${ml}" x2="${W - mr}" y1="${f(Y(lo))}" y2="${f(Y(lo))}"/>`;
  for (let i = 0; i < nX; i++) s += `<text x="${f(X(i))}" y="${H - mb + 18}" text-anchor="middle">${esc(c.x[i] ?? i + 1)}</text>`;
  if (c.ylabel) s += `<text transform="translate(14 ${mt + ph / 2}) rotate(-90)" text-anchor="middle">${esc(c.ylabel)}</text>`;

    s += `</g>`;
  });
  return s + '</svg>';
}

/* Quiz: one question, its options, `- [x]` on the right one; content only, no score, no timer. Two steps:

      for (const l of String(S.deck?.macros || '').split('\n')) try { if (/katex-error/.test(katex.renderToString(l, { macros: S.macros, globalGroup: true, throwOnError: false }))) this.toast(`@macros: KaTeX cannot read ${l}`, 4000); } catch { }
    }
    const macros = S.macros;
    for (const el of root.querySelectorAll('.tex')) {
      if (el._k || el.closest('.code,.algo')) continue;
      const t = el.textContent, d = /^(\$\$|\\\[)/.test(t), n = d || t[0] === '\\' ? 2 : 1;
      try { katex.render(t.slice(n, -n), el, { displayMode: d, throwOnError: false, macros }); el._k = 1; } catch { }
    }
  }

  /* ── teardown ───────────────────────────────────────────── */
  destroy() {
    this.stop(); clearInterval(this.clock); (this.cleanups || []).forEach(f => f());
    this.root.innerHTML = ''; this.root.classList.remove('sv', 'sv-body', 'sv-box', 'sv-scroll', 'sv-present', 'chrome', 'marker', 'idle', 'narrating', 'captions', 'editing', 'presenter', 'split');
    delete this.root.dataset.theme;
  }
}


/* ── index.js ── */















/* Public API.
     Slides.mount(el, options)          → Viewer     (el: element or selector; document.body for full-screen)
     Slides.register(type, def)         add a block type
     Slides.defaults                    global option defaults (mutable)

const instances = [];
const Slides = {
  version: '2.7.0',
  defaults: DEFAULTS, REVEAL_MODES, Blocks, Viewer, instances,
  register, inline, stampCue, clearCues, parseCues, parseVTT, parseQuiz, mediaOf, embedMedia, bundleHTML,
  parse: parseDeck, parseMarkdown, parseJSON, parseDiagram, renderDiagram, parseChart, renderChart,
  mount(el, opts) { const v = new Viewer(el, opts); instances.push(v); return v; },
  autoMount(scope = document) {
    scope.querySelectorAll('[data-slides]').forEach(el => {

      const inlineText = el.querySelector('script[type="text/slides"],script[type="text/markdown"]')?.textContent; if (inlineText) opts.text = inlineText;

    });

Object.defineProperties(Slides, {              // getters, so that assignment installs and reading always returns something that works
  highlight: { get: () => hlRun, set: fn => { hlHook.fn = typeof fn === 'function' ? fn : null; }, enumerable: true },
  shell: { get: () => bundleEnv.shell, set: h => { bundleEnv.shell = h ? String(h) : null; }, enumerable: true }

if (typeof module === 'object' && module.exports) module.exports = Slides;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(() => {
  const q = new URLSearchParams(location.search), opt = {};
  for (const [k, v] of q) if (k in Slides.defaults) opt[k] = v === 'true' ? true : v === 'false' ? false : isNaN(v) || v === '' ? v : +v;
  if (q.has('handout')) opt.mode = 'scroll';
  const text = id => document.getElementById(id)?.textContent.replace(/<\\\/script/g, '</script').trim();
  const deck = document.getElementById('deck');                       // a single-file lesson made by v.bundle() carries its deck here
  if (deck) { opt.text = text('deck'); opt.name = deck.dataset.name || 'deck.md'; } else opt.sample = text('sample');
  Slides.shell = document.documentElement.outerHTML;                 // this page, before the viewer builds its markup: what v.bundle() writes into
  window.viewer = Slides.mount(document.body, opt);
})();
</script>
