<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Binary Heap Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .visualization {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .tree-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .tree-level {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .node {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #0077b6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
            transition: all 0.3s;
            position: relative;
        }

        .node.highlight {
            background: linear-gradient(135deg, #ff6b6b, #c92a2a);
            transform: scale(1.2);
        }

        .node.swapping {
            background: linear-gradient(135deg, #ffd43b, #fab005);
        }

        .node .index {
            position: absolute;
            bottom: -18px;
            font-size: 0.7rem;
            color: #888;
        }

        .array-view {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 30px;
        }

        .array-cell {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            position: relative;
        }

        .array-cell .idx {
            position: absolute;
            bottom: -18px;
            font-size: 0.7rem;
            color: #888;
        }

        .array-cell.highlight {
            background: rgba(255, 107, 107, 0.4);
        }

        .input-section {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .input-section input {
            padding: 10px;
            border-radius: 6px;
            border: none;
            width: 80px;
            text-align: center;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            color: white;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-danger {
            background: linear-gradient(90deg, #ff6b6b, #c92a2a);
            color: white;
        }

        .status {
            text-align: center;
            font-size: 1rem;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin: 15px 0;
        }

        .explanation {
            background: rgba(0, 212, 255, 0.1);
            border-left: 4px solid #00d4ff;
            padding: 20px;
            border-radius: 0 8px 8px 0;
            margin: 20px 0;
        }

        .explanation h3 {
            color: #00d4ff;
            margin-bottom: 10px;
        }

        a.back-link {
            color: #00d4ff;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }
        h1 .icon {
            -webkit-text-fill-color: initial;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to All Algorithms</a>
        <h1><span class="icon" aria-hidden="true">🔺</span> Binary Max-Heap</h1>

        <div class="explanation">
            <h3>Heap Property</h3>
            <p><strong>Max-Heap:</strong> Parent ≥ Children (root is maximum)</p>
            <p style="margin-top: 10px;"><strong>Array Representation (0-based indices):</strong></p>
            <ul style="margin-left: 20px; margin-top: 5px;">
                <li>Parent of i: ⌊(i-1)/2⌋</li>
                <li>Left child: 2i + 1</li>
                <li>Right child: 2i + 2</li>
            </ul>
        </div>

        <div class="visualization">
            <div class="tree-container" id="treeContainer"></div>
            <h4 style="text-align: center; margin-top: 30px; color: #888;">Array Representation</h4>
            <div class="array-view" id="arrayView"></div>
            <div class="status" id="status">Max-Heap visualization. Try inserting or extracting!</div>
        </div>

        <div class="input-section">
            <input type="number" id="insertValue" placeholder="Value" value="15">
        </div>

        <div class="controls">
            <button class="btn-primary" onclick="run(insertValue)">Insert</button>
            <button class="btn-danger" onclick="run(extractMax)">Extract Max</button>
            <button class="btn-secondary" onclick="run(buildHeap)">Build Heap</button>
            <button class="btn-secondary" onclick="reset()">Reset</button>
        </div>
    </div>

    <script>
        let heap = [50, 30, 40, 10, 20, 35, 25];
        let highlight = [];
        const MAX_NODES = 15;   // four full levels: the tree and the array still fit the panel

        // One operation at a time: overlapping animations would interleave their swaps on
        // the same array. Reset bumps runId, which stops a running animation at its next pause.
        let busy = false;
        let runId = 0;

        async function run(op) {
            if (busy) return;
            busy = true;
            const id = runId;
            try {
                await op();
            } catch (e) {
                if (e !== 'reset') throw e;
            } finally {
                if (id === runId) busy = false;
            }
        }

        function renderHeap() {
            // Tree view: level d has 2^d equal slots, so every node sits centred above its
            // two children and a partly filled last level fills from the left.
            const tree = document.getElementById('treeContainer');
            tree.innerHTML = '';
            const width = 64 * Math.pow(2, Math.ceil(Math.log2(heap.length + 1)) - 1);

            let level = 0, idx = 0;
            while (idx < heap.length) {
                const count = Math.pow(2, level);
                const levelDiv = document.createElement('div');
                levelDiv.className = 'tree-level';
                levelDiv.style.gap = '0';

                for (let i = 0; i < count; i++, idx++) {
                    const slot = document.createElement('div');
                    slot.style.cssText = `width: ${width / count}px; display: flex; justify-content: center;`;
                    if (idx < heap.length) {
                        const node = document.createElement('div');
                        node.className = 'node';
                        if (highlight.includes(idx)) node.classList.add('highlight');
                        node.innerHTML = `${heap[idx]}<span class="index">${idx}</span>`;
                        slot.appendChild(node);
                    }
                    levelDiv.appendChild(slot);
                }
                tree.appendChild(levelDiv);
                level++;
            }

            // Array view
            const arr = document.getElementById('arrayView');
            arr.innerHTML = heap.map((v, i) => `
                <div class="array-cell ${highlight.includes(i) ? 'highlight' : ''}">
                    ${v}<span class="idx">${i}</span>
                </div>
            `).join('');
        }

        function setStatus(msg) {
            document.getElementById('status').textContent = msg;
        }

        async function insertValue() {
            const raw = document.getElementById('insertValue').value.trim();
            const val = Number(raw);
            if (raw === '' || !Number.isInteger(val) || Math.abs(val) > 999) {
                setStatus('Enter a whole number from -999 to 999 to insert.');
                return;
            }
            if (heap.length >= MAX_NODES) {
                setStatus(`The heap is full (${MAX_NODES} nodes fit on screen). Extract Max or Reset first.`);
                return;
            }

            heap.push(val);
            let i = heap.length - 1;
            highlight = [i];
            renderHeap();
            setStatus(`Inserted ${val} at index ${i}. Bubble up...`);
            await sleep(500);

            while (i > 0) {
                const parent = Math.floor((i - 1) / 2);
                if (heap[parent] >= heap[i]) break;

                highlight = [i, parent];
                renderHeap();
                setStatus(`${heap[i]} > ${heap[parent]}. Swap!`);
                await sleep(500);

                [heap[parent], heap[i]] = [heap[i], heap[parent]];
                i = parent;
                highlight = [i];
                renderHeap();
                await sleep(300);
            }

            highlight = [];
            renderHeap();
            setStatus(`Insert complete. Heap property restored.`);
        }

        async function extractMax() {
            if (heap.length === 0) { setStatus('Heap is empty!'); return; }

            const max = heap[0];
            setStatus(`Extracting max: ${max}`);
            highlight = [0];
            renderHeap();
            await sleep(500);

            heap[0] = heap[heap.length - 1];
            heap.pop();

            if (heap.length === 0) {
                highlight = [];
                renderHeap();
                setStatus(`Extracted ${max}. Heap is now empty.`);
                return;
            }

            let i = 0;
            highlight = [0];
            renderHeap();
            setStatus(`Moved ${heap[0]} to root. Heapify down...`);
            await sleep(500);

            while (true) {
                const left = 2 * i + 1, right = 2 * i + 2;
                let largest = i;

                if (left < heap.length && heap[left] > heap[largest]) largest = left;
                if (right < heap.length && heap[right] > heap[largest]) largest = right;

                if (largest === i) break;

                highlight = [i, largest];
                renderHeap();
                setStatus(`${heap[i]} < ${heap[largest]}. Swap!`);
                await sleep(500);

                [heap[i], heap[largest]] = [heap[largest], heap[i]];
                i = largest;
                highlight = [i];
                renderHeap();
                await sleep(300);
            }

            highlight = [];
            renderHeap();
            setStatus(`Extracted ${max}. Heap property restored.`);
        }

        async function buildHeap() {
            heap = [3, 1, 6, 5, 2, 4];
            renderHeap();
            setStatus('Building heap from array [3,1,6,5,2,4]...');
            await sleep(500);

            for (let i = Math.floor(heap.length / 2) - 1; i >= 0; i--) {
                await heapifyDown(i);
            }

            highlight = [];
            renderHeap();
            setStatus('Build-Heap complete!');
        }

        async function heapifyDown(i) {
            while (true) {
                const left = 2 * i + 1, right = 2 * i + 2;
                let largest = i;

                if (left < heap.length && heap[left] > heap[largest]) largest = left;
                if (right < heap.length && heap[right] > heap[largest]) largest = right;

                if (largest === i) break;

                highlight = [i, largest];
                renderHeap();
                await sleep(400);

                [heap[i], heap[largest]] = [heap[largest], heap[i]];
                i = largest;
            }
        }

        function reset() {
            runId++;
            busy = false;
            heap = [50, 30, 40, 10, 20, 35, 25];
            highlight = [];
            renderHeap();
            setStatus('Heap reset.');
        }

        // Waits ms; rejects instead if Reset was pressed meanwhile, which ends the animation.
        function sleep(ms) {
            const id = runId;
            return new Promise((resolve, reject) => setTimeout(() => id === runId ? resolve() : reject('reset'), ms));
        }

        renderHeap();
    </script>
    <script src="presenter.js"></script>
</body>

</html>
